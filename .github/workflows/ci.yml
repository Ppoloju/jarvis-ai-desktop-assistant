name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} - Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Lint server
        working-directory: server
        run: npm run lint

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Server tests
        working-directory: server
        shell: bash
        run: |
          set +e
          npm test > "$RUNNER_TEMP/orbit-tests.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            node -e 'const fs = require("fs"); const lines = fs.readFileSync(process.argv[1], "utf8").split(/\r?\n/); const picked = lines.filter((line) => /^not ok|^\s+error:|AssertionError|ERR_|Error:/.test(line)).slice(0, 30); const text = (picked.length ? picked : lines.slice(-40)).join("\n"); process.stdout.write("::error title=orbit test failure::" + text.replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A"));' "$RUNNER_TEMP/orbit-tests.log"
          fi
          exit $status

      - name: Client build
        working-directory: client
        run: npm run build
