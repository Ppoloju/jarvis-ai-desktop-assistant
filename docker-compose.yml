name: orbit

services:
  api:
    build: ./server
    environment:
      NODE_ENV: production
      PORT: "5000"
      CORS_ORIGINS: http://localhost:8081
      ORBIT_DATA_DIR: /data
    volumes:
      - orbit-data:/data
    ports:
      - "127.0.0.1:5000:5000"
    cpus: "0.50"
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build:
      context: ./client
      args:
        VITE_API_BASE: ""
    environment:
      API_UPSTREAM: api:5000
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      api:
        condition: service_healthy
    cpus: "0.25"
    mem_limit: 64m
    restart: unless-stopped

volumes:
  orbit-data:
